name: CI Health Check

# Portable, always-running merge gate. Because it has no path filter it runs on
# EVERY pull request, unlike the repos' own path-filtered CI. It waits for all
# other check runs AND legacy commit statuses on the PR head commit and fails if
# any of them failed, so a single required context ("CI Health Check")
# transitively reflects whatever CI each repo actually ran. A PR that triggers no
# other CI (e.g. docs-only) passes.
#
# Intended to be required org-wide via a repository ruleset "workflows" rule.
#
# Because the ruleset runs this file from THIS repository, the run it produces
# does not belong to a workflow the gated repository knows about: `gh run view
# <id>` there answers 404, and the check run Actions publishes carries no
# output. Anything this job only writes to its log is therefore unreadable from
# the PR it is blocking. That is why the verdict is also written to the job
# summary and to one sticky PR comment — a gate that blocks a merge has to say
# why somewhere the blocked PR can see.

on:
  pull_request:

permissions:
  checks: read
  statuses: read
  contents: read
  # Needed to post the sticky verdict comment. On a fork PR the token is
  # read-only regardless; the comment is attempted and its failure downgraded to
  # a warning, so it can never turn a passing gate red.
  pull-requests: write

concurrency:
  group: ci-health-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: CI Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for sibling checks/statuses and verify none failed
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('Not a pull_request event; nothing to gate.');
              return;
            }
            const sha = pr.head.sha;
            const SELF = 'ci health check'; // matched case-insensitively as a substring
            // Advisory contexts that must never gate a merge: this gate itself, plus
            // AI code reviewers, which post their own check runs. Matched
            // case-insensitively as substrings and dropped from the wait/verify set.
            const IGNORE = [SELF, 'coderabbit', 'copilot'];
            const SETTLE_MS = 20000;        // let sibling checks/statuses register
            const POLL_MS = 15000;
            const DEADLINE = Date.now() + 25 * 60 * 1000;
            // Conclusions/states that should block a merge.
            const BAD = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale', 'error']);
            // Identifies this job's own comment so repeated runs edit one comment
            // instead of adding to a pile.
            const MARKER = '<!-- ci-health-check-verdict -->';

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Collect both modern check runs and legacy commit statuses, normalized
            // to { name, status, conclusion, url }. filter=latest (default) on check
            // runs returns only the most recent run per name, so a re-run-to-green
            // check is treated as passing.
            const gather = async () => {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
              });
              const items = checkRuns.map((r) => ({ name: r.name, status: r.status, conclusion: r.conclusion, url: r.html_url }));

              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
              });
              for (const s of combined.data.statuses) {
                items.push({
                  name: s.context,
                  status: s.state === 'pending' ? 'in_progress' : 'completed',
                  conclusion: s.state === 'success' ? 'success' : (s.state === 'pending' ? null : 'failure'),
                  url: s.target_url,
                });
              }

              return items.filter((i) => !IGNORE.some((n) => i.name.toLowerCase().includes(n)));
            };

            const listItem = (i) => {
              const label = `**${i.name}**${i.conclusion ? ` — ${i.conclusion}` : ''}`;
              return `- ${i.url ? `[${label}](${i.url})` : label}`;
            };

            // Write the verdict where the blocked PR can read it: the job summary,
            // and one sticky comment. A passing run only edits a comment that
            // already exists — a gate that has nothing to report stays silent.
            const report = async (body, { comment }) => {
              await core.summary.addRaw(body).write();
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100,
                });
                const mine = comments.find((c) => (c.body || '').includes(MARKER));
                const payload = `${MARKER}\n${body}`;
                if (mine) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body: payload,
                  });
                } else if (comment) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: payload,
                  });
                }
              } catch (error) {
                // Never let the messenger decide the verdict.
                core.warning(`Could not write the gate's verdict to the PR: ${error.message}`);
              }
            };

            const fail = async (heading, offending, hint) => {
              const body = [
                `### ${heading}`,
                '',
                `Head commit \`${sha.slice(0, 7)}\`.`,
                '',
                ...offending.map(listItem),
                '',
                hint,
              ].join('\n');
              await report(body, { comment: true });
              core.setFailed(`${heading}: ` + offending.map((i) => `${i.name}${i.conclusion ? ` (${i.conclusion})` : ''}`).join(', '));
            };

            const pass = async (message) => {
              await report(`### CI Health Check passed\n\n${message}`, { comment: false });
              core.info(message);
            };

            await sleep(SETTLE_MS);

            let emptyConfirmations = 0;
            while (true) {
              const items = await gather();
              const pending = items.filter((i) => i.status !== 'completed');

              if (items.length === 0) {
                // No sibling CI (e.g. path-filtered docs-only PR). Confirm twice to
                // avoid passing before slow-to-register checks appear.
                if (++emptyConfirmations >= 2) {
                  await pass('No other CI checks or statuses ran on this PR; nothing to fail.');
                  return;
                }
              } else if (pending.length === 0) {
                const failed = items.filter((i) => BAD.has(i.conclusion));
                if (failed.length) {
                  await fail(
                    'CI Health Check failed',
                    failed,
                    'This gate has no opinion of its own — it fails because the checks above did. Fix or re-run them and it goes green.',
                  );
                } else {
                  await pass(`All ${items.length} check(s)/status(es) passed (or were skipped/neutral).`);
                }
                return;
              } else {
                emptyConfirmations = 0;
                core.info(`Waiting on ${pending.length} check(s): ${pending.map((p) => p.name).join(', ')}`);
              }

              if (Date.now() > DEADLINE) {
                await fail(
                  'CI Health Check timed out',
                  pending,
                  'These checks never reported a conclusion within 25 minutes. A wedged or never-started job blocks the merge exactly as a failing one does.',
                );
                return;
              }
              await sleep(POLL_MS);
            }
